:root{--cream:#FFF4E0;--brown:#5A3A22;--red:#D9442B;--orange:#E8762A;--yellow:#F2B930;--green:#6E9E3A;--blue:#2F7DB8;--der:#1A66D9;--die:#E00D0D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--cream);color:var(--brown);font-family:Fredoka,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#fall{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}
header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--brown)}
header h1{margin:0;flex:1;font-size:clamp(24px,4.5vw,38px)}
header h1 span:nth-child(5n+1){color:var(--red)}header h1 span:nth-child(5n+2){color:var(--orange)}header h1 span:nth-child(5n+3){color:var(--yellow)}
header h1 span:nth-child(5n+4){color:var(--green)}header h1 span:nth-child(5n){color:var(--blue)}
.iconbtn{border:3px solid var(--brown);background:#fff;border-radius:14px;font-size:22px;padding:4px 12px;cursor:pointer}
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:12px 14px 18px;overflow:auto}
.screen{width:100%;max-width:1050px;display:none;flex-direction:column;align-items:center;gap:16px}
.screen.on{display:flex}
h2{margin:0;font-size:clamp(22px,4vw,36px);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;width:100%}
.tile{background:#fff;border:4px solid var(--brown);border-radius:24px;padding:16px;text-align:center;cursor:pointer;box-shadow:0 7px 0 var(--brown)}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brown)}
.tile img{height:120px;object-fit:contain}.tile .t{font-size:26px}.tile .s{font-family:Comic;font-size:16px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;width:100%}
.lcard{background:#fff;border:4px solid var(--brown);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 5px 0 var(--brown)}
.lcard.play{box-shadow:0 0 0 6px var(--orange)}
.lcard img{width:100%;height:150px;object-fit:contain}
.name{font-size:clamp(22px,3vw,30px)}
.art-der{color:var(--der)}.art-die{color:var(--die)}
.hidewords .lcard .name{visibility:hidden}
.toggle{font-family:Comic;font-size:18px;display:flex;gap:8px;align-items:center}
.progress{display:flex;gap:6px}.progress i{font-style:normal;font-size:24px;opacity:.25;filter:grayscale(1)}.progress i.done{opacity:1;filter:none}
.leafbig{background:#fff;border:4px solid var(--brown);border-radius:26px;padding:14px;box-shadow:0 7px 0 var(--brown)}
.leafbig img{height:min(36vh,300px);max-width:80vw;object-fit:contain;display:block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:700px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--brown);border-radius:20px;padding:10px 14px;cursor:pointer;box-shadow:0 6px 0 var(--brown);font-size:clamp(22px,3.4vw,32px)}
.opt .sp{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--brown);background:var(--yellow);font-size:24px;display:flex;align-items:center;justify-content:center}
.opt.ok{background:#E2F3D2;border-color:var(--green);box-shadow:0 6px 0 var(--green)}
.opt.no{background:#FBDCD6;border-color:var(--red);box-shadow:0 6px 0 var(--red);animation:shake .35s;opacity:.6}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.feedback{font-size:28px;min-height:38px;text-align:center}
/* Zuordnen */
.match{display:flex;flex-direction:column;gap:16px;width:100%;align-items:center}
.pool{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:150px}
.drag{width:clamp(110px,16vw,150px);height:clamp(110px,16vw,150px);background:#fff;border:4px solid var(--brown);border-radius:20px;padding:8px;cursor:grab;box-shadow:0 5px 0 var(--brown);touch-action:none}
.drag img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.drag.sel{box-shadow:0 0 0 6px var(--orange)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%}
.slot{background:#fff;border:4px dashed var(--brown);border-radius:20px;min-height:clamp(170px,26vh,230px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;gap:6px;cursor:pointer}
.slot .drop{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.slot .drop img{max-width:90%;max-height:clamp(90px,15vh,140px);object-fit:contain}
.slot .lab{display:flex;align-items:center;gap:8px;font-size:clamp(18px,2.6vw,26px)}
.slot .lab .sp{width:40px;height:40px;border-radius:50%;border:3px solid var(--brown);background:var(--yellow);font-size:18px;display:flex;align-items:center;justify-content:center}
.slot.hover{background:#FFF0D6}.slot.filled{border-style:solid;border-color:var(--green);background:#EEF8E4}
.ghost{position:fixed;z-index:9;pointer-events:none;width:130px;height:130px;transform:translate(-50%,-50%) rotate(-6deg);filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ghost img{width:100%;height:100%;object-fit:contain}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font-family:Fredoka;font-size:24px;border:4px solid var(--brown);border-radius:18px;padding:10px 26px;background:var(--yellow);cursor:pointer;box-shadow:0 5px 0 var(--brown);color:var(--brown)}
.btn.sec{background:#fff}
.trophy{font-size:96px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
@media (max-width:700px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<canvas id="fall"></canvas>
<header>
  <h1 id="logo"></h1>
  <button class="iconbtn" id="home" title="Menü">🏠</button>
  <button class="iconbtn" id="full" title="Vollbild">⛶</button>
</header>
<main>
  <section class="screen on" id="menu">
    <h2>Was möchtest du machen?</h2>
    <div class="tiles">
      <div class="tile" data-go="learn"><img id="ti1"><div class="t">Blätter kennenlernen</div><div class="s">Tippen und anhören</div></div>
      <div class="tile" data-go="guess"><img id="ti2"><div class="t">Welches Blatt ist das?</div><div class="s">Schau genau und rate!</div></div>
      <div class="tile" data-go="match"><img id="ti3"><div class="t">Blätter zuordnen</div><div class="s">Zieh das Blatt zum Namen</div></div>
    </div>
  </section>
  <section class="screen" id="learn">
    <h2>Tippe auf ein Blatt!</h2>
    <label class="toggle"><input type="checkbox" id="hide"> Namen verstecken</label>
    <div class="grid" id="lgrid"></div>
  </section>
  <section class="screen" id="game">
    <div class="progress" id="prog"></div>
    <h2 id="ask"></h2>
    <div id="stage" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>
    <div class="feedback" id="fb"></div>
  </section>
  <section class="screen" id="end">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="endtitle"></h2>
    <div style="font-size:52px" id="endstars"></div>
    <div class="btnrow"><button class="btn" id="again">Nochmal</button><button class="btn sec" id="tomenu">Menü</button></div>
  </section>
</main>

  P=Array.from({length:14},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:30+Math.random()*40,v:.4+Math.random()*.8,a:Math.random()*6,i:Math.floor(Math.random()*imgs.length)}));
  (function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.01;p.x+=Math.sin(p.a)*.6;if(p.y>c.height+60){p.y=-60;p.x=Math.random()*c.width}
    x.save();x.translate(p.x,p.y);x.rotate(p.a);if(imgs[p.i].complete)x.drawImage(imgs[p.i],-p.s/2,-p.s/2,p.s,p.s);x.restore()});requestAnimationFrame(d)})()})();
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#D9442B','#E8762A','#F2B930','#6E9E3A','#2F7DB8'];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*5)],vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(++f<200)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
